<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <form [formGroup]="form" (ngSubmit)="login()">
    <div class="form-group">
      <label for="nombre">Usuario</label>
      <input id="nombre" formControlName="nombre" type="text" placeholder="Usuario" />
    </div>
    <div class="form-group">
      <label for="contraseña">Contraseña</label>
      <input id="contraseña" formControlName="contraseña" type="password" placeholder="Contraseña" />
    </div>
    <button type="submit" [disabled]="form.invalid || cargando">Entrar</button>
    <div *ngIf="error" class="error">{{ error }}</div>
  </form>
</div>
