<button style="
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 9999;
  background-color: #3b82f6;
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  outline: none;
  padding: 0;
  line-height: 1;
  border: 2px solid white;
  box-sizing: border-box;
" 
onmouseover="this.style.backgroundColor='#2563eb'; this.style.transform='scale(1.1)'; this.style.boxShadow='0 6px 15px rgba(0, 0, 0, 0.3)';"
onmouseout="this.style.backgroundColor='#3b82f6'; this.style.transform='scale(1)'; this.style.boxShadow='0 4px 10px rgba(0, 0, 0, 0.2)';"
onclick="window.history.back();">
  ←
</button>

<div class="contenedor-mostrar-usuarios">
  <h2>Gestionar Usuarios</h2>

  <div *ngIf="mensaje" [ngClass]="'mensaje-' + tipoMensaje" class="mensaje">
    {{ mensaje }}
  </div>

  <div class="buscador">
    <input
      type="text"
      [(ngModel)]="busqueda"
      placeholder="Buscar usuario por nombre..."
      (keyup)="buscarUsuarios()"
      class="input-busqueda"
    />
    <button (click)="buscarUsuarios()" class="btn-buscar">Buscar</button>
    <button (click)="cargarUsuarios()" class="btn-recargar">Recargar</button>
    <button [routerLink]="['/crear-usuario']" class="btn-crear">➕</button>
  </div>

  <div *ngIf="cargando" class="cargando">
    <p>Cargando usuarios...</p>
  </div>

  <div *ngIf="!cargando && usuariosFiltrados.length === 0" class="sin-resultados">
    <p>No se encontraron usuarios</p>
  </div>

  <div *ngIf="!cargando && usuariosFiltrados.length > 0" class="tabla-contenedor">
    <table class="tabla-usuarios">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Permisos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuariosFiltrados" class="fila-usuario">
          <td>{{ usuario.nombre }}</td>
          <td>
            <span *ngIf="usuario.permisos && usuario.permisos.admin" class="badge-admin">
              Administrador
            </span>
            <span *ngIf="!usuario.permisos || !usuario.permisos.admin" class="badge-usuario">
              Usuario
            </span>
          </td>
          <td class="acciones">
            <button
              (click)="seleccionarUsuario(usuario)"
              class="btn-editar"
              title="Editar usuario"
            >
              Editar
            </button>
            <button
              (click)="eliminarUsuario(usuario._id)"
              class="btn-eliminar"
              title="Eliminar usuario"
            >
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="mostrarConfirmacion" class="modal-confirm">
    <div class="modal-content">
      <p>¿Estás seguro de que deseas eliminar este usuario?</p>
      <button (click)="confirmarEliminacion()" style="background:#d32f2f;color:#fff;margin-right:1em;">Sí</button>
      <button (click)="cancelarEliminacion()">No</button>
    </div>
  </div>
</div>
