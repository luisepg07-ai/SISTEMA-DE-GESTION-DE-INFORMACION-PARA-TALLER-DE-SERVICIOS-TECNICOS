<button style="
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 9999;
  background-color: #3b82f6;
  color: white;
  border: none;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  outline: none;
  padding: 0;
  line-height: 1;
  border: 2px solid white;
  box-sizing: border-box;
" onmouseover="this.style.backgroundColor='#2563eb'; this.style.transform='scale(1.1)'; this.style.boxShadow='0 6px 15px rgba(0, 0, 0, 0.3)';"
  onmouseout="this.style.backgroundColor='#3b82f6'; this.style.transform='scale(1)'; this.style.boxShadow='0 4px 10px rgba(0, 0, 0, 0.2)';"
  onclick="window.history.back();">
  ←
</button>
<h2>Editar Proveedor Registrado</h2>
<form [formGroup]="proveedorForm" (ngSubmit)="actualizarProveedor()" class="form-crear-proveedor">
  <label>Nombre del Proveedor:
    <input formControlName="nombreProveedor" autocomplete="off" />
  </label>
  <label>Email de contacto:
    <input formControlName="contactoEmail" autocomplete="off" />
  </label>
  <label>Teléfono:
    <input formControlName="telefono" autocomplete="off" type="tel" />
  </label>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="exito" class="exito">Proveedor actualizado correctamente.</div>
  <div class="botones">
    <button type="submit" [disabled]="enviado">Actualizar</button>
    <button type="button" class="eliminar" (click)="pedirConfirmacion()" [disabled]="enviado">Eliminar</button>
  </div>
</form>

<div *ngIf="mostrarConfirmacion" class="modal-confirm">
  <div class="modal-content">
    <p>¿Seguro que deseas eliminar este proveedor?</p>
    <div>
      <button (click)="confirmarEliminacion()" style="background:#d32f2f;color:#fff;margin-right:1em;">Sí</button>
      <button (click)="mostrarConfirmacion = false">No</button>
    </div>
  </div>
</div>
